<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azizbek Tojiboyev — Rekvizitlar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Ko'zni charchatmaydigan yumshoq moviy-kulrang va yorug' shisha uslubi */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #334155 0%, #3b4d6b 45%, #475569 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            user-select: none;
        }

        /* Orqa fondagi mayin, ko'zga yoqimli yorug'lik sharlari */
        .ambient-light {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }

        /* Asosiy shaffof karta (Frosted Glass) - To'liq, keng va chiroyli tashqi ramka bilan */
        .main-glass {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 2px solid rgba(255, 255, 255, 0.35); /* Chiroyli oq ramka liniyasi */
            box-shadow: 0 30px 60px rgba(15, 23, 42, 0.4);
            border-radius: 36px; /* Silliq burchaklar */
            width: 100%;
            max-width: 580px;  /* Kengroq ekran */
            min-height: 560px; /* Uzunroq korinish */
        }

        /* Ichki silliq kataklar */
        .smooth-box {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 22px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .smooth-box-interactive:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .smooth-box-interactive:active {
            transform: scale(0.985);
            background: rgba(255, 255, 255, 0.24);
        }

        /* Yanada silliq va mayin sahifa almashish animatsiyalari */
        .fade-slide-next {
            animation: slideNext 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .fade-slide-prev {
            animation: slidePrev 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .fade-in-tab {
            animation: fadeInTab 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideNext {
            from { opacity: 0; transform: translateX(35px) scale(0.98); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        @keyframes slidePrev {
            from { opacity: 0; transform: translateX(-35px) scale(0.98); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        @keyframes fadeInTab {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Toast xabarnoma holati */
        .toast-visible {
            opacity: 1 !important;
            transform: translate(-50%, 0) !important;
        }
    </style>
</head>
<body class="p-4 sm:p-6">

    <!-- Fondagi yumshoq rangli yog'dular -->
    <div class="ambient-light w-80 h-80 bg-sky-300/40 -top-16 -left-16"></div>
    <div class="ambient-light w-96 h-96 bg-indigo-300/35 -bottom-20 -right-16"></div>

    <!-- Nusxalanganlik haqida pastki xabarnoma (Toast) -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-4 opacity-0 pointer-events-none z-50 transition-all duration-300 bg-white text-slate-800 px-6 py-3 rounded-full shadow-2xl flex items-center gap-2.5 text-sm font-semibold whitespace-nowrap">
        <span class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs">✓</span>
        <span id="toast-msg">Nusxalandi!</span>
    </div>

    <!-- Ekran markazidagi asosiy keng karta -->
    <main id="app-card" class="main-glass p-6 sm:p-8 relative z-10 flex flex-col justify-between mx-auto">
        
        <!-- Yuqori qism: Eng tepa chap burchakda ism-familiya -->
        <div>
            <header class="flex items-center justify-start pb-4 mb-6 border-b border-white/20">
                <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white pl-0.5">Azizbek Tojiboyev</h1>
            </header>

            <!-- Sahifa kontenti -->
            <section id="page-content" class="w-full">
                <!-- JavaScript orqali dinamik yuklanadi -->
            </section>
        </div>

        <!-- Pastki navigatsiya: Chap strelka, 3 ta kichik doira, O'ng strelka -->
        <footer class="pt-6 mt-6 border-t border-white/20 flex items-center justify-between relative h-14">
            
            <!-- Chapga (avvalgi sahifaga) silliq ko'rsatkich -->
            <button id="btn-prev" type="button" aria-label="Avvalgi sahifa" class="w-12 h-12 rounded-full bg-white/20 hover:bg-white/30 active:scale-95 border border-white/30 flex items-center justify-center text-white transition-all duration-200 shadow-sm cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>

            <!-- Markazdagi 3 ta kichik doira -->
            <div id="dots-wrapper" class="flex items-center gap-3 absolute left-1/2 -translate-x-1/2">
                <!-- Doiralar JS orqali chiziladi -->
            </div>

            <!-- O'ngga (keyingi sahifaga) silliq ko'rsatkich -->
            <button id="btn-next" type="button" aria-label="Keyingi sahifa" class="w-12 h-12 rounded-full bg-white/20 hover:bg-white/30 active:scale-95 border border-white/30 flex items-center justify-center text-white transition-all duration-200 shadow-sm cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>

        </footer>
    </main>

    <!-- Nusxalash uchun yordamchi maydon -->
    <textarea id="clipboard-helper" class="fixed -top-96 opacity-0 pointer-events-none" readonly></textarea>

    <script>
        // Sahifalar tuzilmasi
        const totalPages = 3;
        let currentPage = 0; // 0 = 1-sahifa, 1 = 2-sahifa, 2 = 3-sahifa
        let activeTab = 'uzcard'; // 2-sahifadagi faol karta turi
        let toastTimer = null;

        // Karta ma'lumotlari (faqat karta raqami va egasi)
        const cardsData = {
            uzcard: [
                {
                    label: "Karta raqami",
                    display: "5614 6865 0712 1112",
                    copyValue: "5614686507121112"
                },
                {
                    label: "Karta egasi",
                    display: "Azizbek Tojiboyev",
                    copyValue: "Azizbek Tojiboyev"
                }
            ],
            humo: [
                {
                    label: "Karta raqami",
                    display: "9860 1966 1905 8718",
                    copyValue: "9860196619058718"
                },
                {
                    label: "Karta egasi",
                    display: "Azizbek Tojiboyev",
                    copyValue: "Azizbek Tojiboyev"
                }
            ]
        };

        // DOM elementlari
        const pageContentEl = document.getElementById('page-content');
        const dotsWrapperEl = document.getElementById('dots-wrapper');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const appCard = document.getElementById('app-card');
        const toastEl = document.getElementById('toast');
        const toastMsgEl = document.getElementById('toast-msg');
        const clipboardHelper = document.getElementById('clipboard-helper');

        // Toast xabarnomasini ko'rsatish
        function triggerToast(text) {
            toastMsgEl.textContent = text;
            toastEl.classList.add('toast-visible');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('toast-visible');
            }, 2000);
        }

        // Nusxalash funksiyasi
        function copyText(value, label) {
            clipboardHelper.value = value;
            clipboardHelper.select();
            clipboardHelper.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                triggerToast(`${label} nusxalandi!`);
            } catch (err) {
                triggerToast('Nusxalashda xatolik');
            }
            window.getSelection().removeAllRanges();
        }

        // 2-sahifa ichidagi karta kataklarini chizish
        function renderCardBoxes(container, items) {
            container.innerHTML = '';
            items.forEach(item => {
                const box = document.createElement('div');
                box.className = 'smooth-box smooth-box-interactive p-4 cursor-pointer flex items-center justify-between gap-3';
                box.innerHTML = `
                    <div>
                        <div class="text-xs font-medium text-white/75 mb-1">${item.label}</div>
                        <div class="text-base sm:text-[17px] font-semibold text-white tracking-wide">${item.display}</div>
                    </div>
                    <div class="w-9 h-9 rounded-full bg-white/15 flex items-center justify-center text-white shrink-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <rect x="9" y="9" width="13" height="13" rx="3" ry="3"></rect>
                            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
                        </svg>
                    </div>
                `;
                box.addEventListener('click', () => copyText(item.copyValue, item.label));
                container.appendChild(box);
            });
        }

        // Asosiy sahifani yangilash
        function renderCurrentPage(direction = 'none') {
            pageContentEl.classList.remove('fade-slide-next', 'fade-slide-prev');
            void pageContentEl.offsetWidth;

            if (direction === 'next') {
                pageContentEl.classList.add('fade-slide-next');
            } else if (direction === 'prev') {
                pageContentEl.classList.add('fade-slide-prev');
            }

            pageContentEl.innerHTML = '';

            // 1-SAHIFA: Salomlashish
            if (currentPage === 0) {
                pageContentEl.innerHTML = `
                    <div class="smooth-box p-8 sm:p-10 text-center flex flex-col items-center justify-center min-h-[280px] space-y-4">
                        <div class="w-16 h-16 rounded-full bg-white/20 border border-white/30 flex items-center justify-center text-3xl shadow-md">
                            👋
                        </div>
                        <h2 class="text-xl sm:text-2xl font-bold text-white">Assalomu alaykum! Xush kelibsiz!</h2>
                        <p class="text-sm sm:text-base text-white/90 leading-relaxed max-w-md">
                            Sizni ko'rib turganimizdan va sahifamizga tashrif buyurganingizdan juda xursandmiz. Keyingi sahifada to'lov ma'lumotlari joylashgan.
                        </p>
                    </div>
                `;
            }
            // 2-SAHIFA: Uzcard va Humo tanlovi hamda karta ma'lumotlari
            else if (currentPage === 1) {
                const tabHeader = document.createElement('div');
                tabHeader.className = 'grid grid-cols-2 gap-2 p-1.5 rounded-2xl bg-white/10 border border-white/20 mb-5';

                const uzcardTabBtn = document.createElement('button');
                uzcardTabBtn.type = 'button';
                uzcardTabBtn.textContent = 'Uzcard';
                uzcardTabBtn.className = `py-3 rounded-xl text-sm font-semibold transition-all duration-300 cursor-pointer ${
                    activeTab === 'uzcard'
                        ? 'bg-white text-slate-800 shadow-md'
                        : 'text-white/85 hover:text-white hover:bg-white/10'
                }`;

                const humoTabBtn = document.createElement('button');
                humoTabBtn.type = 'button';
                humoTabBtn.textContent = 'Humo';
                humoTabBtn.className = `py-3 rounded-xl text-sm font-semibold transition-all duration-300 cursor-pointer ${
                    activeTab === 'humo'
                        ? 'bg-white text-slate-800 shadow-md'
                        : 'text-white/85 hover:text-white hover:bg-white/10'
                }`;

                const boxesContainer = document.createElement('div');
                boxesContainer.className = 'space-y-3.5 fade-in-tab';

                uzcardTabBtn.addEventListener('click', () => {
                    if (activeTab !== 'uzcard') {
                        activeTab = 'uzcard';
                        renderCurrentPage('none');
                    }
                });

                humoTabBtn.addEventListener('click', () => {
                    if (activeTab !== 'humo') {
                        activeTab = 'humo';
                        renderCurrentPage('none');
                    }
                });

                tabHeader.appendChild(uzcardTabBtn);
                tabHeader.appendChild(humoTabBtn);
                pageContentEl.appendChild(tabHeader);
                pageContentEl.appendChild(boxesContainer);

                renderCardBoxes(boxesContainer, cardsData[activeTab]);
            }
            // 3-SAHIFA: Minnatdorchilik
            else if (currentPage === 2) {
                pageContentEl.innerHTML = `
                    <div class="smooth-box p-8 sm:p-10 text-center flex flex-col items-center justify-center min-h-[280px] space-y-4">
                        <div class="w-16 h-16 rounded-full bg-white/20 border border-white/30 flex items-center justify-center text-3xl shadow-md">
                            🤝
                        </div>
                        <h2 class="text-xl sm:text-2xl font-bold text-white">E'tiboringiz uchun rahmat!</h2>
                        <p class="text-sm sm:text-base text-white/90 leading-relaxed max-w-md">
                            Vaqt ajratib tashrif buyurganingiz uchun samimiy minnatdorchilik bildiramiz. Kuningiz xayrli va barakali o'tsin!
                        </p>
                    </div>
                `;
            }

            // Pastki 3 ta kichik doirachani yangilash
            dotsWrapperEl.innerHTML = '';
            for (let i = 0; i < totalPages; i++) {
                const dot = document.createElement('button');
                dot.type = 'button';
                dot.setAttribute('aria-label', `${i + 1}-sahifa`);
                const isActive = i === currentPage;
                dot.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 cursor-pointer ${
                    isActive
                        ? 'bg-white scale-125 shadow-[0_0_10px_rgba(255,255,255,0.9)]'
                        : 'bg-white/35 hover:bg-white/55'
                }`;
                dot.addEventListener('click', () => {
                    if (i !== currentPage) {
                        const dir = i > currentPage ? 'next' : 'prev';
                        currentPage = i;
                        renderCurrentPage(dir);
                    }
                });
                dotsWrapperEl.appendChild(dot);
            }

            // Ko'rsatkich strelkalarini boshqarish:
            // 1-sahifa: faqat o'ngda
            // 2-sahifa: ikkala tarafda
            // 3-sahifa: faqat chapda
            if (currentPage === 0) {
                btnPrev.classList.add('invisible', 'pointer-events-none', 'opacity-0');
            } else {
                btnPrev.classList.remove('invisible', 'pointer-events-none', 'opacity-0');
            }

            if (currentPage === totalPages - 1) {
                btnNext.classList.add('invisible', 'pointer-events-none', 'opacity-0');
            } else {
                btnNext.classList.remove('invisible', 'pointer-events-none', 'opacity-0');
            }
        }

        // Tugmalar bosilganda
        btnPrev.addEventListener('click', () => {
            if (currentPage > 0) {
                currentPage--;
                renderCurrentPage('prev');
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentPage < totalPages - 1) {
                currentPage++;
                renderCurrentPage('next');
            }
        });

        // Klaviatura strelkalari bilan boshqarish
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentPage < totalPages - 1) {
                currentPage++;
                renderCurrentPage('next');
            } else if (e.key === 'ArrowLeft' && currentPage > 0) {
                currentPage--;
                renderCurrentPage('prev');
            }
        });

        // Mobil qurilmalarda barmoq bilan surish (Swipe)
        let startX = 0;
        let endX = 0;

        appCard.addEventListener('touchstart', (e) => {
            startX = e.changedTouches[0].screenX;
        }, { passive: true });

        appCard.addEventListener('touchend', (e) => {
            endX = e.changedTouches[0].screenX;
            const diff = startX - endX;
            if (Math.abs(diff) > 45) {
                if (diff > 0 && currentPage < totalPages - 1) {
                    currentPage++;
                    renderCurrentPage('next');
                } else if (diff < 0 && currentPage > 0) {
                    currentPage--;
                    renderCurrentPage('prev');
                }
            }
        }, { passive: true });

        // Sahifa yuklanganda ishga tushirish
        window.addEventListener('DOMContentLoaded', () => {
            renderCurrentPage('none');
        });
    </script>
</body>
</html>
