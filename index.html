<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rekvizitlar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Asosiy shrift va to'q ko'k/siyohrang gradient fon */
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a 60%, #020617);
            color: #f8fafc;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Orqa fondagi mayin yorug'lik effektlari */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(85px);
            z-index: 0;
            opacity: 0.4;
            pointer-events: none;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(25px, -25px) scale(1.08); }
        }

        /* Glassmorphism asosiy oyna */
        .glass-panel {
            background: rgba(255, 255, 255, 0.045);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
        }

        /* Silliq qirrali rekvizit kataklari */
        .req-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .req-card:hover {
            background: rgba(255, 255, 255, 0.11);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .req-card:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.16);
        }

        /* Sahifa almashish animatsiyalari */
        .slide-enter-right {
            animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .slide-enter-left {
            animation: slideInLeft 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(22px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-22px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Pastki Toast xabarnoma animatsiyasi */
        .toast-show {
            opacity: 1 !important;
            transform: translate(-50%, 0) !important;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <!-- Fondagi dekorativ yorug'lik sharlari -->
    <div class="bg-orb w-72 h-72 bg-indigo-600 top-[-40px] left-[-40px]"></div>
    <div class="bg-orb w-80 h-80 bg-purple-700 bottom-[-60px] right-[-40px]" style="animation-delay: -6s;"></div>

    <!-- Pastki Toast xabarnomasi -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-4 opacity-0 pointer-events-none z-50 transition-all duration-300 bg-emerald-500/95 backdrop-blur-md text-white px-4 py-2.5 rounded-2xl shadow-xl border border-emerald-400/30 flex items-center gap-2 text-sm font-medium whitespace-nowrap">
        <svg class="w-4 h-4 text-white shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
        </svg>
        <span id="toast-text">Nusxalandi!</span>
    </div>

    <!-- Asosiy App Konteyneri (Swipe qo'llab-quvvatlaydi) -->
    <main id="app-wrapper" class="glass-panel w-full max-w-md rounded-3xl p-6 relative z-10 flex flex-col justify-between min-h-[490px]">
        
        <!-- Yuqori qism: Minimalistik sarlavha -->
        <div>
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-white/10">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-md border border-white/20">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-base font-bold text-white leading-tight">Azizbek Tojiboyev</h1>
                        <p class="text-xs text-indigo-300/80 mt-0.5">To'lov rekvizitlari</p>
                    </div>
                </div>
                <span id="page-badge" class="text-xs font-semibold px-3 py-1 rounded-full bg-white/10 text-indigo-200 border border-white/10">
                    1 / 3
                </span>
            </div>

            <!-- Sahifa kontenti konteyneri -->
            <div id="cards-container" class="space-y-3">
                <!-- JavaScript orqali to'ldiriladi -->
            </div>
        </div>

        <!-- Pastki navigatsiya paneli -->
        <div class="mt-8 pt-4 border-t border-white/10 flex items-center justify-between relative h-12">
            
            <!-- Chap tarafdagi ko'rsatkich (Avvalgi sahifa) -->
            <button id="prev-btn" aria-label="Avvalgi sahifa" class="w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 border border-white/15 flex items-center justify-center text-white transition-all duration-200 shadow-md">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>

            <!-- Markazdagi sahifa indikator doirachalari -->
            <div id="dots-container" class="flex items-center gap-2.5 absolute left-1/2 -translate-x-1/2">
                <!-- Doirachalar JS orqali chiziladi -->
            </div>

            <!-- O'ng tarafdagi ko'rsatkich (Keyingi sahifa) -->
            <button id="next-btn" aria-label="Keyingi sahifa" class="w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 border border-white/15 flex items-center justify-center text-white transition-all duration-200 shadow-md">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>

        </div>
    </main>

    <!-- Nusxalash uchun yashirin textarea -->
    <textarea id="copy-helper" class="fixed -top-96 opacity-0 pointer-events-none" readonly></textarea>

    <script>
        // 3 ta sahifa ma'lumotlari
        const pagesData = [
            {
                type: 'welcome'
            },
            {
                type: 'cards',
                tabs: {
                    uzcard: [
                        { label: "Karta raqami (Uzcard)", value: "5614 6865 0712 1112", copyValue: "5614686507121112" },
                        { label: "Karta egasi", value: "AZIZBEK TOJIBOYEV", copyValue: "AZIZBEK TOJIBOYEV" }
                    ],
                    humo: [
                        { label: "Karta raqami (Humo)", value: "9860 1966 1905 8718", copyValue: "9860196619058718" },
                        { label: "Karta egasi", value: "AZIZBEK TOJIBOYEV", copyValue: "AZIZBEK TOJIBOYEV" }
                    ]
                }
            },
            {
                type: 'thanks'
            }
        ];

        let currentPage = 0;
        let activeCardTab = 'uzcard'; // 2-sahifadagi faol bo'lim (uzcard yoki humo)
        let toastTimeout = null;

        // DOM elementlari
        const pageBadgeEl = document.getElementById('page-badge');
        const cardsContainerEl = document.getElementById('cards-container');
        const dotsContainerEl = document.getElementById('dots-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const appWrapper = document.getElementById('app-wrapper');
        const toastEl = document.getElementById('toast');
        const toastTextEl = document.getElementById('toast-text');
        const copyHelperEl = document.getElementById('copy-helper');

        // Toast xabarnomasini ko'rsatish
        function showToast(message) {
            toastTextEl.textContent = message;
            toastEl.classList.add('toast-show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.classList.remove('toast-show');
            }, 2200);
        }

        // Nusxalash funksiyasi
        function copyToClipboard(text, label) {
            copyHelperEl.value = text;
            copyHelperEl.select();
            copyHelperEl.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                showToast(`${label} nusxalandi!`);
            } catch (err) {
                showToast('Nusxalashda xatolik yuz berdi');
            }
            window.getSelection().removeAllRanges();
        }

        // 2-sahifa ichidagi Uzcard / Humo kartalarini chizish
        function renderCardItems(container, items) {
            container.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'req-card p-4 cursor-pointer flex items-center justify-between group';
                card.innerHTML = `
                    <div class="pr-3">
                        <div class="text-[11px] font-medium uppercase tracking-wider text-indigo-300/80 mb-1">${item.label}</div>
                        <div class="text-[15px] font-semibold text-white break-all">${item.value}</div>
                    </div>
                    <div class="w-9 h-9 rounded-xl bg-white/5 group-hover:bg-white/15 flex items-center justify-center text-slate-300 group-hover:text-white transition-colors shrink-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
                        </svg>
                    </div>
                `;
                card.addEventListener('click', () => copyToClipboard(item.copyValue, item.label));
                container.appendChild(card);
            });
        }

        // Sahifani chizish funksiyasi
        function renderPage(direction = 'none') {
            const page = pagesData[currentPage];

            // Sahifa raqamini yangilash
            pageBadgeEl.textContent = `${currentPage + 1} / ${pagesData.length}`;

            // Sahifa almashish animatsiyasi
            cardsContainerEl.classList.remove('slide-enter-right', 'slide-enter-left');
            void cardsContainerEl.offsetWidth;
            if (direction === 'next') {
                cardsContainerEl.classList.add('slide-enter-right');
            } else if (direction === 'prev') {
                cardsContainerEl.classList.add('slide-enter-left');
            }

            cardsContainerEl.innerHTML = '';

            // 1-SAHIFA: Salomlashish
            if (page.type === 'welcome') {
                cardsContainerEl.innerHTML = `
                    <div class="req-card p-6 text-center flex flex-col items-center justify-center min-h-[250px] space-y-4">
                        <div class="w-14 h-14 rounded-2xl bg-indigo-500/20 border border-indigo-400/30 flex items-center justify-center text-2xl shadow-inner">
                            👋
                        </div>
                        <h2 class="text-xl font-bold text-white tracking-tight">Assalomu alaykum!</h2>
                        <p class="text-sm text-slate-300 leading-relaxed">
                            Sizni ko'rib turganimizdan va sahifamizga tashrif buyurganingizdan juda xursandmiz! Keyingi sahifada to'lov rekvizitlarini topishingiz mumkin.
                        </p>
                    </div>
                `;
            } 
            // 2-SAHIFA: Tepada Uzcard va Humo tanlovi + tegishli karta raqami va egasi
            else if (page.type === 'cards') {
                const tabsWrapper = document.createElement('div');
                tabsWrapper.className = 'grid grid-cols-2 gap-2 p-1.5 rounded-2xl bg-white/5 border border-white/10 mb-4';

                const uzcardBtn = document.createElement('button');
                uzcardBtn.textContent = 'Uzcard';
                uzcardBtn.className = `py-2.5 rounded-xl text-sm font-semibold transition-all duration-200 cursor-pointer ${
                    activeCardTab === 'uzcard'
                        ? 'bg-indigo-500 text-white shadow-lg shadow-indigo-500/30'
                        : 'text-slate-300 hover:text-white hover:bg-white/5'
                }`;

                const humoBtn = document.createElement('button');
                humoBtn.textContent = 'Humo';
                humoBtn.className = `py-2.5 rounded-xl text-sm font-semibold transition-all duration-200 cursor-pointer ${
                    activeCardTab === 'humo'
                        ? 'bg-indigo-500 text-white shadow-lg shadow-indigo-500/30'
                        : 'text-slate-300 hover:text-white hover:bg-white/5'
                }`;

                const itemsListEl = document.createElement('div');
                itemsListEl.className = 'space-y-3';

                uzcardBtn.addEventListener('click', () => {
                    if (activeCardTab !== 'uzcard') {
                        activeCardTab = 'uzcard';
                        renderPage('none');
                    }
                });

                humoBtn.addEventListener('click', () => {
                    if (activeCardTab !== 'humo') {
                        activeCardTab = 'humo';
                        renderPage('none');
                    }
                });

                tabsWrapper.appendChild(uzcardBtn);
                tabsWrapper.appendChild(humoBtn);
                cardsContainerEl.appendChild(tabsWrapper);
                cardsContainerEl.appendChild(itemsListEl);

                renderCardItems(itemsListEl, page.tabs[activeCardTab]);
            } 
            // 3-SAHIFA: E'tibori uchun rahmat
            else if (page.type === 'thanks') {
                cardsContainerEl.innerHTML = `
                    <div class="req-card p-6 text-center flex flex-col items-center justify-center min-h-[250px] space-y-4">
                        <div class="w-14 h-14 rounded-2xl bg-emerald-500/20 border border-emerald-400/30 flex items-center justify-center text-2xl shadow-inner">
                            🤝
                        </div>
                        <h2 class="text-xl font-bold text-white tracking-tight">E'tiboringiz uchun rahmat!</h2>
                        <p class="text-sm text-slate-300 leading-relaxed">
                            Vaqt ajratib tashrif buyurganingiz uchun samimiy minnatdorchilik bildiramiz. Kuningiz xayrli va barakali o'tsin!
                        </p>
                    </div>
                `;
            }

            // Pastki markaziy doirachalarni yangilash
            dotsContainerEl.innerHTML = '';
            pagesData.forEach((_, idx) => {
                const dot = document.createElement('button');
                dot.setAttribute('aria-label', `${idx + 1}-sahifaga o'tish`);
                const isActive = idx === currentPage;
                dot.className = `h-2.5 rounded-full transition-all duration-300 cursor-pointer ${
                    isActive 
                        ? 'w-7 bg-white shadow-[0_0_10px_rgba(255,255,255,0.85)]' 
                        : 'w-2.5 bg-white/30 hover:bg-white/50'
                }`;
                dot.addEventListener('click', () => {
                    if (idx !== currentPage) {
                        const dir = idx > currentPage ? 'next' : 'prev';
                        currentPage = idx;
                        renderPage(dir);
                    }
                });
                dotsContainerEl.appendChild(dot);
            });

            // Navigatsiya tugmalari sharti:
            // 1-sahifada: faqat o'ngda
            // 2-sahifada: ikkala tomonda
            // 3-sahifada: faqat chapda
            if (currentPage === 0) {
                prevBtn.classList.add('invisible', 'pointer-events-none', 'opacity-0');
            } else {
                prevBtn.classList.remove('invisible', 'pointer-events-none', 'opacity-0');
            }

            if (currentPage === pagesData.length - 1) {
                nextBtn.classList.add('invisible', 'pointer-events-none', 'opacity-0');
            } else {
                nextBtn.classList.remove('invisible', 'pointer-events-none', 'opacity-0');
            }
        }

        // Tugma hodisalari
        prevBtn.addEventListener('click', () => {
            if (currentPage > 0) {
                currentPage--;
                renderPage('prev');
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentPage < pagesData.length - 1) {
                currentPage++;
                renderPage('next');
            }
        });

        // Klaviatura strelkalari
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentPage < pagesData.length - 1) {
                currentPage++;
                renderPage('next');
            } else if (e.key === 'ArrowLeft' && currentPage > 0) {
                currentPage--;
                renderPage('prev');
            }
        });

        // Barmoq bilan surish (Swipe)
        let touchStartX = 0;
        let touchEndX = 0;

        appWrapper.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        appWrapper.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;

            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0 && currentPage < pagesData.length - 1) {
                    currentPage++;
                    renderPage('next');
                } else if (diff < 0 && currentPage > 0) {
                    currentPage--;
                    renderPage('prev');
                }
            }
        }

        // Ishga tushirish
        window.addEventListener('DOMContentLoaded', () => {
            renderPage('none');
        });
    </script>
</body>
</html>
